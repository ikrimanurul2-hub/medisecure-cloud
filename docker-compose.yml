services:
  mysql:
    image: mysql:8.0
    container_name: medisecure-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: medisecure_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: medisecure-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_NAME: MediSecure Cloud
      APP_ENV: development
      APP_PORT: 5000
      APP_URL: http://localhost:5000

      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:5000

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: medisecure_db
      DB_USER: root
      DB_PASSWORD: rootpassword

      JWT_SECRET: medisecure_super_secret_key_change_this_later
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_SECRET: medisecure_refresh_secret_key_change_this_later
      JWT_REFRESH_EXPIRES_IN: 7d

      BCRYPT_SALT_ROUNDS: 10
      CORS_ORIGIN: http://localhost:8080

      RATE_LIMIT_WINDOW_MINUTES: 15
      RATE_LIMIT_MAX_REQUESTS: 100
      LOGIN_RATE_LIMIT_WINDOW_MINUTES: 15
      LOGIN_RATE_LIMIT_MAX_ATTEMPTS: 5

      MAX_FILE_SIZE_MB: 5
      ALLOWED_FILE_TYPES: application/pdf,image/png,image/jpeg
      ALLOWED_FILE_EXTENSIONS: pdf,png,jpg,jpeg
      STORAGE_PROVIDER: Local Secure Storage

      AI_PROVIDER: gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: gemini-2.5-flash

      LOG_LEVEL: info
      ENABLE_ACTIVITY_LOG: "true"
      ENABLE_SECURITY_ALERT: "true"
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
    container_name: medisecure-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
  backend_uploads: